<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script>
  async function click() {
    const protocol = "austroads-request-forwarding-v2";
    const request = {
      deviceRequest: "a",
      encryptionInfo: "b",
    };

    await navigator.identity.get({
      digital: {
        providers: [{ request, protocol }],
      },
      mediation: "required",
    });
  }
</script>
<h1>
    Click the button below to trigger the identity request
</h1>
<button onclick="click()">Click me</button>
